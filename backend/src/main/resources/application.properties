# Active profiles configuration
spring.profiles.active=local
server.port=8081

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Admin Account Provisioning Configuration
admin.provision.enabled=${ADMIN_PROVISION_ENABLED:true}
admin.provision.email=${ADMIN_EMAIL:admin@forgeai.com}
admin.provision.password=${ADMIN_PASSWORD:Admin@ForgeAI2026!}
admin.provision.name=${ADMIN_NAME:ForgeAI Administrator}

# JWT Configuration
jwt.secret=${JWT_SECRET:ForgeAISuperSecretKeyForJWTAuthTokenGeneration2026!}

