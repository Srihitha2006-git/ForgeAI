# Active profiles configuration
spring.profiles.active=local
spring.config.import=optional:file:.env[.properties]
server.port=8081

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Admin Account Provisioning Configuration
admin.provision.enabled=${ADMIN_PROVISION_ENABLED:true}
admin.provision.email=${ADMIN_EMAIL:admin@forgeai.com}
admin.provision.password=${ADMIN_PASSWORD:Admin@ForgeAI2026!}
admin.provision.name=${ADMIN_NAME:ForgeAI Administrator}

# JWT Configuration
jwt.secret=${JWT_SECRET:ForgeAISuperSecretKeyForJWTAuthTokenGeneration2026!}

# AI Chatbot Configuration (Phase 5A)
ai.provider=${AI_PROVIDER:}
ai.chat.max-message-length=${AI_MAX_MESSAGE_LENGTH:1000}
ai.chat.timeout-seconds=${AI_TIMEOUT_SECONDS:15}
ai.chat.rate-limit-per-minute=${AI_RATE_LIMIT_PER_MINUTE:20}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

